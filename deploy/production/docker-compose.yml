name: aerolog

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: /api
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: /api
    networks:
      - internal
    mem_limit: 192m

  api:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: api
    restart: unless-stopped
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_API_ADDR: ":8082"
      AEROLOG_METRICS_ADDR: ":9103"
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_CH_ADDR: clickhouse:9000
      AEROLOG_CH_DB: aerolog
      AEROLOG_CH_USER: aerolog
      AEROLOG_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      AEROLOG_CORS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - internal
      # 神策 OpenAPI 校验需要出网；API 到数据库的流量仍保留在仅内部网络。
      - api-egress
    mem_limit: 192m

  wecom-aibot:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.wecom-aibot
    restart: unless-stopped
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_WECOM_BOT_API_URL: http://api:8082
      AEROLOG_WECOM_BOT_METRICS_PORT: "9106"
    depends_on:
      - api
    networks:
      - internal
      - api-egress
    mem_limit: 128m

  # 只读宿主机文件系统巡检服务，仅通过 Docker 内网向 API 提供固定目录聚合大小。
  host-inspector:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: hostinspector
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_HOST_ROOT: /host
      AEROLOG_HOST_INSPECTOR_ADDR: ":8086"
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal
    mem_limit: 96m

  collector:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: collector
    restart: unless-stopped
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_ADDR: ":8081"
      AEROLOG_METRICS_ADDR: ":9101"
      # 默认使用内置 Redpanda。若需复用托管 Kafka 集群，在私有 .env 设置 AEROLOG_KAFKA_BROKERS。
      AEROLOG_KAFKA_BROKERS: ${AEROLOG_KAFKA_BROKERS:-redpanda:9092}
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      # 当 AEROLOG_KAFKA_BROKERS 指向 Docker 内部网络外的托管 Kafka 时，为服务提供出网路由。
      - kafka-ingress
    mem_limit: 144m

  consumer:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: consumer
    restart: unless-stopped
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      # 默认使用内置 Redpanda。若需复用托管 Kafka 集群，在私有 .env 设置 AEROLOG_KAFKA_BROKERS。
      AEROLOG_KAFKA_BROKERS: ${AEROLOG_KAFKA_BROKERS:-redpanda:9092}
      AEROLOG_CH_ADDR: clickhouse:9000
      AEROLOG_CH_DB: aerolog
      AEROLOG_CH_USER: aerolog
      AEROLOG_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_METRICS_ADDR: ":9102"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - internal
      # 当 AEROLOG_KAFKA_BROKERS 指向 Docker 内部网络外的托管 Kafka 时，为服务提供出网路由。
      - kafka-ingress
    mem_limit: 176m

  # 可选神策 Kafka 导入器。刻意使用 profile 隔离，避免未配置本地目标项目时就消费外部数据。
  sensors-consumer:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: consumer
    restart: unless-stopped
    profiles: ["sensorsdata"]
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_KAFKA_BROKERS: ${AEROLOG_KAFKA_BROKERS:-redpanda:9092}
      AEROLOG_KAFKA_TOPIC: ${AEROLOG_SENSORS_EVENTS_TOPIC:-sensors.events.v1}
      AEROLOG_GROUP_ID: ${AEROLOG_SENSORS_GROUP_ID:-aerolog-sensors-consumer}
      AEROLOG_INPUT_FORMAT: sensors_flatten_json
      AEROLOG_SENSORS_TARGET_PROJECT_ID: ${AEROLOG_SENSORS_TARGET_PROJECT_ID:-0}
      # 有界同步写入：ClickHouse 不可用时不提交 Kafka offset，通过背压避免数据丢失。
      AEROLOG_CONSUMER_BATCH_SIZE: ${AEROLOG_CONSUMER_BATCH_SIZE:-200}
      AEROLOG_CONSUMER_BATCH_MS: ${AEROLOG_CONSUMER_BATCH_MS:-5000}
      AEROLOG_CONSUMER_WRITE_TIMEOUT_MS: ${AEROLOG_CONSUMER_WRITE_TIMEOUT_MS:-15000}
      AEROLOG_CONSUMER_RETRY_INITIAL_MS: ${AEROLOG_CONSUMER_RETRY_INITIAL_MS:-1000}
      AEROLOG_CONSUMER_RETRY_MAX_MS: ${AEROLOG_CONSUMER_RETRY_MAX_MS:-30000}
      AEROLOG_CH_ADDR: clickhouse:9000
      AEROLOG_CH_DB: aerolog
      AEROLOG_CH_USER: aerolog
      AEROLOG_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_METRICS_ADDR: ":9104"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - internal
      - kafka-ingress
    mem_limit: 176m

  # 可选神策用户属性导入器。消费者组和 Topic 与事件接入分离，避免属性延迟阻塞事件。
  sensors-profile-consumer:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: consumer
    restart: unless-stopped
    profiles: ["sensorsdata"]
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_KAFKA_BROKERS: ${AEROLOG_KAFKA_BROKERS:-redpanda:9092}
      AEROLOG_KAFKA_TOPIC: ${AEROLOG_SENSORS_PROFILES_TOPIC:-sensors.profiles.v1}
      AEROLOG_GROUP_ID: ${AEROLOG_SENSORS_PROFILES_GROUP_ID:-aerolog-sensors-profiles-consumer}
      AEROLOG_INPUT_FORMAT: sensors_flatten_profile_json
      AEROLOG_SENSORS_TARGET_PROJECT_ID: ${AEROLOG_SENSORS_TARGET_PROJECT_ID:-0}
      AEROLOG_CONSUMER_BATCH_SIZE: ${AEROLOG_CONSUMER_BATCH_SIZE:-200}
      AEROLOG_CONSUMER_BATCH_MS: ${AEROLOG_CONSUMER_BATCH_MS:-5000}
      AEROLOG_CONSUMER_WRITE_TIMEOUT_MS: ${AEROLOG_CONSUMER_WRITE_TIMEOUT_MS:-15000}
      AEROLOG_CONSUMER_RETRY_INITIAL_MS: ${AEROLOG_CONSUMER_RETRY_INITIAL_MS:-1000}
      AEROLOG_CONSUMER_RETRY_MAX_MS: ${AEROLOG_CONSUMER_RETRY_MAX_MS:-30000}
      AEROLOG_CH_ADDR: clickhouse:9000
      AEROLOG_CH_DB: aerolog
      AEROLOG_CH_USER: aerolog
      AEROLOG_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_METRICS_ADDR: ":9105"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - internal
      - kafka-ingress
    mem_limit: 176m

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aerolog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aerolog
    volumes:
      - /var/lib/aerolog/postgres:/var/lib/postgresql/data
      - ../init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerolog"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /var/lib/aerolog/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal
    mem_limit: 80m

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # AeroLog 链路仅使用 Docker 内部监听器；外部监听器仅供神策 Kafka 订阅使用。
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://${AEROLOG_KAFKA_EXTERNAL_ADVERTISED_ADDR:-kafka.example.com}:9092
    ports:
      # 仅绑定 IPv4。访问受云安全组及宿主机 deploy/production/scripts/apply-kafka-firewall.sh 限制。
      - "${AEROLOG_KAFKA_BIND_ADDR:-0.0.0.0}:9092:19092"
    volumes:
      - /var/lib/aerolog/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls=localhost:9644"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - internal
      # 专用非内部网络发布内置 Kafka 监听器，并为使用托管 Kafka 的 Collector/Consumer 提供出网能力。
      - kafka-ingress
    mem_limit: 900m

  redpanda-console:
    image: redpandadata/console:v2.6.0
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      SERVER_BASEPATH: /queue
      SERVER_SETBASEPATHFROMXFORWARDEDPREFIX: "true"
    networks:
      - internal
    mem_limit: 128m

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: aerolog
      CLICKHOUSE_USER: aerolog
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - /var/lib/aerolog/clickhouse:/var/lib/clickhouse
      - ../init/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 18
    networks:
      - internal
    # 神策实时接入在合并和分析读取时可能超过 768MB 基线，保留足够内存余量避免 OOM 重启。
    mem_limit: 2g

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - /var/lib/aerolog/prometheus:/prometheus
    networks:
      - internal
    mem_limit: 220m

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - internal
    mem_limit: 80m

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin@example.com}
      GF_SECURITY_ADMIN_PASSWORD: ${AEROLOG_BOOTSTRAP_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${AEROLOG_PUBLIC_HOST:-analytics.example.com}
      GF_SERVER_ROOT_URL: https://${AEROLOG_PUBLIC_HOST:-analytics.example.com}/monitor/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /var/lib/aerolog/grafana:/var/lib/grafana
    networks:
      - internal
    mem_limit: 180m

networks:
  internal:
    internal: true
  kafka-ingress:
  # API 集成（如神策 OpenAPI）的专用出网通道。
  api-egress:
