name: aerolog

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE: /api
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: /api
    networks:
      - internal
    mem_limit: 192m

  api:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: api
    restart: unless-stopped
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_API_ADDR: ":8082"
      AEROLOG_METRICS_ADDR: ":9103"
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_CH_ADDR: clickhouse:9000
      AEROLOG_CH_DB: aerolog
      AEROLOG_CH_USER: aerolog
      AEROLOG_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      AEROLOG_CORS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - internal
      # Sensors Data OpenAPI verification needs outbound access while API-to-DB
      # traffic remains on the internal-only network.
      - api-egress
    mem_limit: 192m

  collector:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: collector
    restart: unless-stopped
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_ADDR: ":8081"
      AEROLOG_METRICS_ADDR: ":9101"
      # Default uses the bundled Redpanda. Set AEROLOG_KAFKA_BROKERS in the
      # private .env to reuse a managed Kafka cluster instead.
      AEROLOG_KAFKA_BROKERS: ${AEROLOG_KAFKA_BROKERS:-redpanda:9092}
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      # Gives the service an egress route when AEROLOG_KAFKA_BROKERS points
      # to a managed Kafka outside Docker's internal-only network.
      - kafka-ingress
    mem_limit: 144m

  consumer:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: consumer
    restart: unless-stopped
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      # Default uses the bundled Redpanda. Set AEROLOG_KAFKA_BROKERS in the
      # private .env to reuse a managed Kafka cluster instead.
      AEROLOG_KAFKA_BROKERS: ${AEROLOG_KAFKA_BROKERS:-redpanda:9092}
      AEROLOG_CH_ADDR: clickhouse:9000
      AEROLOG_CH_DB: aerolog
      AEROLOG_CH_USER: aerolog
      AEROLOG_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_METRICS_ADDR: ":9102"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - internal
      # Gives the service an egress route when AEROLOG_KAFKA_BROKERS points
      # to a managed Kafka outside Docker's internal-only network.
      - kafka-ingress
    mem_limit: 176m

  # Optional Sensors Data Kafka importer. It is deliberately profile-gated so
  # a deployment cannot consume external data before a local target project is
  # explicitly configured.
  sensors-consumer:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: consumer
    restart: unless-stopped
    profiles: ["sensorsdata"]
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_KAFKA_BROKERS: ${AEROLOG_KAFKA_BROKERS:-redpanda:9092}
      AEROLOG_KAFKA_TOPIC: ${AEROLOG_SENSORS_EVENTS_TOPIC:-sensors.events.v1}
      AEROLOG_GROUP_ID: ${AEROLOG_SENSORS_GROUP_ID:-aerolog-sensors-consumer}
      AEROLOG_INPUT_FORMAT: sensors_flatten_json
      AEROLOG_SENSORS_TARGET_PROJECT_ID: ${AEROLOG_SENSORS_TARGET_PROJECT_ID:-0}
      # Synchronous, bounded writes keep Kafka offsets uncommitted while
      # ClickHouse is unavailable, providing backpressure instead of loss.
      AEROLOG_CONSUMER_BATCH_SIZE: ${AEROLOG_CONSUMER_BATCH_SIZE:-200}
      AEROLOG_CONSUMER_BATCH_MS: ${AEROLOG_CONSUMER_BATCH_MS:-5000}
      AEROLOG_CONSUMER_WRITE_TIMEOUT_MS: ${AEROLOG_CONSUMER_WRITE_TIMEOUT_MS:-15000}
      AEROLOG_CONSUMER_RETRY_INITIAL_MS: ${AEROLOG_CONSUMER_RETRY_INITIAL_MS:-1000}
      AEROLOG_CONSUMER_RETRY_MAX_MS: ${AEROLOG_CONSUMER_RETRY_MAX_MS:-30000}
      AEROLOG_CH_ADDR: clickhouse:9000
      AEROLOG_CH_DB: aerolog
      AEROLOG_CH_USER: aerolog
      AEROLOG_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_METRICS_ADDR: ":9104"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - internal
      - kafka-ingress
    mem_limit: 176m

  # Optional Sensors Data profile importer. Keep its consumer group and topic
  # separate from event ingestion so profile delays never block events.
  sensors-profile-consumer:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile.go
      args:
        SERVICE: consumer
    restart: unless-stopped
    profiles: ["sensorsdata"]
    env_file: ${AEROLOG_ENV_FILE:-.env}
    environment:
      AEROLOG_KAFKA_BROKERS: ${AEROLOG_KAFKA_BROKERS:-redpanda:9092}
      AEROLOG_KAFKA_TOPIC: ${AEROLOG_SENSORS_PROFILES_TOPIC:-sensors.profiles.v1}
      AEROLOG_GROUP_ID: ${AEROLOG_SENSORS_PROFILES_GROUP_ID:-aerolog-sensors-profiles-consumer}
      AEROLOG_INPUT_FORMAT: sensors_flatten_profile_json
      AEROLOG_SENSORS_TARGET_PROJECT_ID: ${AEROLOG_SENSORS_TARGET_PROJECT_ID:-0}
      AEROLOG_CONSUMER_BATCH_SIZE: ${AEROLOG_CONSUMER_BATCH_SIZE:-200}
      AEROLOG_CONSUMER_BATCH_MS: ${AEROLOG_CONSUMER_BATCH_MS:-5000}
      AEROLOG_CONSUMER_WRITE_TIMEOUT_MS: ${AEROLOG_CONSUMER_WRITE_TIMEOUT_MS:-15000}
      AEROLOG_CONSUMER_RETRY_INITIAL_MS: ${AEROLOG_CONSUMER_RETRY_INITIAL_MS:-1000}
      AEROLOG_CONSUMER_RETRY_MAX_MS: ${AEROLOG_CONSUMER_RETRY_MAX_MS:-30000}
      AEROLOG_CH_ADDR: clickhouse:9000
      AEROLOG_CH_DB: aerolog
      AEROLOG_CH_USER: aerolog
      AEROLOG_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
      AEROLOG_PG_DSN: postgres://aerolog:${POSTGRES_PASSWORD}@postgres:5432/aerolog?sslmode=disable
      AEROLOG_METRICS_ADDR: ":9105"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - internal
      - kafka-ingress
    mem_limit: 176m

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aerolog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aerolog
    volumes:
      - /var/lib/aerolog/postgres:/var/lib/postgresql/data
      - ../init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerolog"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /var/lib/aerolog/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - internal
    mem_limit: 80m

  redpanda:
    image: redpandadata/redpanda:v24.3.5
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Keep the AeroLog pipeline on the Docker-only listener. The external
      # listener is exclusively for Sensors Data's Kafka subscription.
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://${AEROLOG_KAFKA_EXTERNAL_ADVERTISED_ADDR:-kafka.example.com}:9092
    ports:
      # Bind IPv4 only. Access is restricted by the cloud security group and
      # deploy/production/scripts/apply-kafka-firewall.sh on the host.
      - "${AEROLOG_KAFKA_BIND_ADDR:-0.0.0.0}:9092:19092"
    volumes:
      - /var/lib/aerolog/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --api-urls=localhost:9644"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - internal
      # A dedicated non-internal network publishes the bundled Kafka listener
      # and supplies egress for Collector/Consumer when using managed Kafka.
      - kafka-ingress
    mem_limit: 900m

  redpanda-console:
    image: redpandadata/console:v2.6.0
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      SERVER_BASEPATH: /queue
      SERVER_SETBASEPATHFROMXFORWARDEDPREFIX: "true"
    networks:
      - internal
    mem_limit: 128m

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: aerolog
      CLICKHOUSE_USER: aerolog
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - /var/lib/aerolog/clickhouse:/var/lib/clickhouse
      - ../init/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 18
    networks:
      - internal
    # Sensors Data realtime ingestion can exceed the 768MB baseline during
    # merges and analytical reads. Keep enough headroom to avoid OOM restarts.
    mem_limit: 2g

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - /var/lib/aerolog/prometheus:/prometheus
    networks:
      - internal
    mem_limit: 220m

  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin@example.com}
      GF_SECURITY_ADMIN_PASSWORD: ${AEROLOG_BOOTSTRAP_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${AEROLOG_PUBLIC_HOST:-analytics.example.com}
      GF_SERVER_ROOT_URL: https://${AEROLOG_PUBLIC_HOST:-analytics.example.com}/monitor/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /var/lib/aerolog/grafana:/var/lib/grafana
    networks:
      - internal
    mem_limit: 180m

networks:
  internal:
    internal: true
  kafka-ingress:
  # Dedicated outbound path for API integrations such as Sensors Data OpenAPI.
  api-egress:
